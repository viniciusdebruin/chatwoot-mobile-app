name: Build APK - deBruin Chat

on:
  push:
    branches: [develop]

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout do repositório
        uses: actions/checkout@v3

      - name: ⚙️ Configurar JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 🧱 Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk android-sdk
          npm install -g yarn
          yarn install

      - name: 🧪 Permissões de Gradlew
        run: chmod +x android/gradlew

      - name: 🏗️ Build APK com Gradle
        working-directory: android
        run: ./gradlew assembleRelease

      - name: 📦 Upload APK gerado
        uses: actions/upload-artifact@v3
        with:
          name: debruin-chat-apk
          path: android/app/build/outputs/apk/release/app-release.apk
